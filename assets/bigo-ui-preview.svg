<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" style="background: transparent;">
  <defs>
    <!-- Window Shadow Filter -->
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feOffset dx="0" dy="12" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.45" result="color"/>
      <feComposite in2="blur" in="color" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21242b"/>
      <stop offset="100%" stop-color="#1c1e24"/>
    </linearGradient>

    <linearGradient id="accentBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <g filter="url(#winShadow)">
    <!-- Main Window Background -->
    <rect x="20" y="20" width="940" height="580" rx="10" ry="10" fill="#1e2025" stroke="#353841" stroke-width="1.2"/>

    <!-- Window Title Bar -->
    <path d="M 20 30 Q 20 20 30 20 L 950 20 Q 960 20 960 30 L 960 58 L 20 58 Z" fill="#181a1f" stroke="#2b2e35" stroke-width="1"/>
    
    <!-- Traffic lights / window controls -->
    <circle cx="42" cy="39" r="6" fill="#ed4245"/>
    <circle cx="62" cy="39" r="6" fill="#fee75c"/>
    <circle cx="82" cy="39" r="6" fill="#57f287"/>

    <!-- Window Title -->
    <text x="490" y="44" class="sans" font-size="12" font-weight="600" fill="#9da5b4" text-anchor="middle">Big-O Runtime Estimator: Scientific Asymptotic Complexity Simulator (FlatLaf Dark)</text>

    <!-- App Header & Toolbar Area -->
    <rect x="20" y="58" width="940" height="106" fill="url(#headerGrad)" stroke="#2b2e35" stroke-width="1"/>

    <!-- Title and Subtitle -->
    <text x="46" y="88" class="sans" font-size="18" font-weight="700" fill="#f0f3f6">Big-O Runtime Estimator</text>
    <text x="46" y="105" class="sans" font-size="11.5" fill="#8b949e">Arbitrary-precision arithmetic (BigInteger / BigDecimal) with Ramanujan-Stirling asymptotics</text>

    <!-- Toolbar Input Controls -->
    <!-- Input n -->
    <g transform="translate(46, 120)">
      <text x="0" y="18" class="sans" font-size="12" font-weight="600" fill="#c9d1d9">Size n:</text>
      <rect x="48" y="0" width="85" height="26" rx="4" fill="#282c34" stroke="#4c5362" stroke-width="1"/>
      <text x="56" y="18" class="mono" font-size="13" font-weight="700" fill="#61afef">10,000</text>
    </g>

    <!-- Presets -->
    <g transform="translate(190, 120)">
      <rect x="0" y="0" width="34" height="26" rx="4" fill="#282c34" stroke="#3e4451" stroke-width="1"/>
      <text x="17" y="17" class="sans" font-size="11" fill="#abb2bf" text-anchor="middle">10</text>

      <rect x="38" y="0" width="38" height="26" rx="4" fill="#282c34" stroke="#3e4451" stroke-width="1"/>
      <text x="57" y="17" class="sans" font-size="11" fill="#abb2bf" text-anchor="middle">100</text>

      <rect x="80" y="0" width="34" height="26" rx="4" fill="#282c34" stroke="#3e4451" stroke-width="1"/>
      <text x="97" y="17" class="sans" font-size="11" fill="#abb2bf" text-anchor="middle">1k</text>

      <!-- Active Preset: 10k -->
      <rect x="118" y="0" width="38" height="26" rx="4" fill="#2563eb" stroke="#3b82f6" stroke-width="1"/>
      <text x="137" y="17" class="sans" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">10k</text>

      <rect x="160" y="0" width="44" height="26" rx="4" fill="#282c34" stroke="#3e4451" stroke-width="1"/>
      <text x="182" y="17" class="sans" font-size="11" fill="#abb2bf" text-anchor="middle">100k</text>

      <rect x="208" y="0" width="38" height="26" rx="4" fill="#282c34" stroke="#3e4451" stroke-width="1"/>
      <text x="227" y="17" class="sans" font-size="11" fill="#abb2bf" text-anchor="middle">1M</text>
    </g>

    <!-- Step Latency -->
    <g transform="translate(450, 120)">
      <text x="0" y="18" class="sans" font-size="12" font-weight="600" fill="#c9d1d9">Step Latency:</text>
      <rect x="88" y="0" width="60" height="26" rx="4" fill="#282c34" stroke="#4c5362" stroke-width="1"/>
      <text x="96" y="18" class="mono" font-size="13" font-weight="700" fill="#61afef">1.0</text>

      <!-- Unit Selector Dropdown -->
      <rect x="154" y="0" width="135" height="26" rx="4" fill="#282c34" stroke="#4c5362" stroke-width="1"/>
      <text x="164" y="17" class="sans" font-size="11.5" fill="#e5c07b">Microseconds (µs)</text>
      <path d="M 276 11 L 280 16 L 284 11 Z" fill="#8b949e"/>
    </g>

    <!-- Calculate Button -->
    <g transform="translate(815, 120)">
      <rect x="0" y="0" width="105" height="26" rx="4" fill="url(#accentBtn)" stroke="#3b82f6" stroke-width="1"/>
      <text x="52" y="17" class="sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Recalculate</text>
    </g>

    <!-- Tabs Bar -->
    <g transform="translate(46, 175)">
      <!-- Tab 1 Active -->
      <rect x="0" y="0" width="220" height="30" rx="4" fill="#23272e"/>
      <text x="110" y="20" class="sans" font-size="12" font-weight="700" fill="#61afef" text-anchor="middle">Simultaneous Comparison Table</text>
      <rect x="0" y="28" width="220" height="2" fill="#61afef"/>

      <!-- Tab 2 -->
      <text x="315" y="20" class="sans" font-size="12" fill="#8b949e" text-anchor="middle">Individual Detailed Analysis</text>

      <!-- Tab 3 -->
      <text x="495" y="20" class="sans" font-size="12" fill="#8b949e" text-anchor="middle">Complexity Reference Guide</text>
    </g>

    <line x1="46" y1="205" x2="914" y2="205" stroke="#353841" stroke-width="1"/>

    <!-- Data Table Container -->
    <g transform="translate(46, 215)">
      <!-- Table Header -->
      <rect x="0" y="0" width="868" height="32" rx="4" fill="#21252b"/>
      <text x="20" y="21" class="sans" font-size="11.5" font-weight="700" fill="#9da5b4">Complexity Class</text>
      <text x="160" y="21" class="sans" font-size="11.5" font-weight="700" fill="#9da5b4">Notation</text>
      <text x="270" y="21" class="sans" font-size="11.5" font-weight="700" fill="#9da5b4">Efficiency Rating</text>
      <text x="430" y="21" class="sans" font-size="11.5" font-weight="700" fill="#9da5b4">Operations f(n)</text>
      <text x="650" y="21" class="sans" font-size="11.5" font-weight="700" fill="#9da5b4">Estimated Execution Runtime</text>

      <!-- Row 1: O(1) -->
      <g transform="translate(0, 34)">
        <rect x="0" y="0" width="868" height="36" fill="#1b1d22"/>
        <text x="20" y="23" class="sans" font-size="12.5" font-weight="600" fill="#abb2bf">Constant</text>
        <text x="160" y="23" class="mono" font-size="12.5" font-weight="700" fill="#61afef">O(1)</text>
        <!-- Badge -->
        <rect x="270" y="9" width="90" height="19" rx="9.5" fill="#133629"/>
        <text x="315" y="23" class="sans" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">EXCELLENT</text>
        <text x="430" y="23" class="mono" font-size="12" fill="#c9d1d9">1</text>
        <text x="650" y="23" class="mono" font-size="12.5" font-weight="700" fill="#34d399">1.000 µs</text>
      </g>

      <!-- Row 2: O(log n) -->
      <g transform="translate(0, 71)">
        <rect x="0" y="0" width="868" height="36" fill="#1e2026"/>
        <text x="20" y="23" class="sans" font-size="12.5" font-weight="600" fill="#abb2bf">Logarithmic</text>
        <text x="160" y="23" class="mono" font-size="12.5" font-weight="700" fill="#61afef">O(log n)</text>
        <rect x="270" y="9" width="90" height="19" rx="9.5" fill="#133629"/>
        <text x="315" y="23" class="sans" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">EXCELLENT</text>
        <text x="430" y="23" class="mono" font-size="12" fill="#c9d1d9">13.288</text>
        <text x="650" y="23" class="mono" font-size="12.5" font-weight="700" fill="#34d399">13.288 µs</text>
      </g>

      <!-- Row 3: O(n) -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="868" height="36" fill="#1b1d22"/>
        <text x="20" y="23" class="sans" font-size="12.5" font-weight="600" fill="#abb2bf">Linear</text>
        <text x="160" y="23" class="mono" font-size="12.5" font-weight="700" fill="#61afef">O(n)</text>
        <rect x="270" y="9" width="70" height="19" rx="9.5" fill="#0c353b"/>
        <text x="305" y="23" class="sans" font-size="10" font-weight="700" fill="#22d3ee" text-anchor="middle">GOOD</text>
        <text x="430" y="23" class="mono" font-size="12" fill="#c9d1d9">10,000</text>
        <text x="650" y="23" class="mono" font-size="12.5" font-weight="700" fill="#22d3ee">10.000 ms</text>
      </g>

      <!-- Row 4: O(n log n) -->
      <g transform="translate(0, 145)">
        <rect x="0" y="0" width="868" height="36" fill="#1e2026"/>
        <text x="20" y="23" class="sans" font-size="12.5" font-weight="600" fill="#abb2bf">Linearithmic</text>
        <text x="160" y="23" class="mono" font-size="12.5" font-weight="700" fill="#61afef">O(n log n)</text>
        <rect x="270" y="9" width="65" height="19" rx="9.5" fill="#172b4d"/>
        <text x="302" y="23" class="sans" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">FAIR</text>
        <text x="430" y="23" class="mono" font-size="12" fill="#c9d1d9">132,877</text>
        <text x="650" y="23" class="mono" font-size="12.5" font-weight="700" fill="#60a5fa">132.877 ms</text>
      </g>

      <!-- Row 5: O(n^2) -->
      <g transform="translate(0, 182)">
        <rect x="0" y="0" width="868" height="36" fill="#1b1d22"/>
        <text x="20" y="23" class="sans" font-size="12.5" font-weight="600" fill="#abb2bf">Quadratic</text>
        <text x="160" y="23" class="mono" font-size="12.5" font-weight="700" fill="#61afef">O(n²)</text>
        <rect x="270" y="9" width="70" height="19" rx="9.5" fill="#3a2f14"/>
        <text x="305" y="23" class="sans" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">POOR</text>
        <text x="430" y="23" class="mono" font-size="12" fill="#c9d1d9">100,000,000</text>
        <text x="650" y="23" class="mono" font-size="12.5" font-weight="700" fill="#fbbf24">1.667 min (100.00 s)</text>
      </g>

      <!-- Row 6: O(n^3) -->
      <g transform="translate(0, 219)">
        <rect x="0" y="0" width="868" height="36" fill="#1e2026"/>
        <text x="20" y="23" class="sans" font-size="12.5" font-weight="600" fill="#abb2bf">Cubic</text>
        <text x="160" y="23" class="mono" font-size="12.5" font-weight="700" fill="#61afef">O(n³)</text>
        <rect x="270" y="9" width="60" height="19" rx="9.5" fill="#3c2214"/>
        <text x="300" y="23" class="sans" font-size="10" font-weight="700" fill="#fb923c" text-anchor="middle">BAD</text>
        <text x="430" y="23" class="mono" font-size="12" fill="#c9d1d9">1,000,000,000,000</text>
        <text x="650" y="23" class="mono" font-size="12.5" font-weight="700" fill="#fb923c">11.574 days</text>
      </g>

      <!-- Row 7: O(2^n) -->
      <g transform="translate(0, 256)">
        <rect x="0" y="0" width="868" height="36" fill="#1b1d22"/>
        <text x="20" y="23" class="sans" font-size="12.5" font-weight="600" fill="#abb2bf">Exponential</text>
        <text x="160" y="23" class="mono" font-size="12.5" font-weight="700" fill="#61afef">O(2ⁿ)</text>
        <rect x="270" y="9" width="85" height="19" rx="9.5" fill="#3d1519"/>
        <text x="312" y="23" class="sans" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">HORRIBLE</text>
        <text x="430" y="23" class="mono" font-size="12" fill="#e06c75">1.995 × 10³⁰¹⁰</text>
        <text x="650" y="23" class="mono" font-size="12.5" font-weight="700" fill="#f87171">&gt; 6.322 × 10²⁹⁹⁶ years</text>
      </g>

      <!-- Row 8: O(n!) -->
      <g transform="translate(0, 293)">
        <rect x="0" y="0" width="868" height="36" fill="#1e2026"/>
        <text x="20" y="23" class="sans" font-size="12.5" font-weight="600" fill="#abb2bf">Factorial (TSP)</text>
        <text x="160" y="23" class="mono" font-size="12.5" font-weight="700" fill="#61afef">O(n!)</text>
        <rect x="270" y="9" width="85" height="19" rx="9.5" fill="#3d1519"/>
        <text x="312" y="23" class="sans" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">HORRIBLE</text>
        <text x="430" y="23" class="mono" font-size="12" fill="#e06c75">2.846 × 10³⁵⁶⁵⁹ (Stirling)</text>
        <text x="650" y="23" class="mono" font-size="12.5" font-weight="700" fill="#f87171">&gt; 9.020 × 10³⁵⁶⁴⁵ years</text>
      </g>
    </g>

    <!-- Footer Status Bar -->
    <path d="M 20 568 L 960 568 L 960 590 Q 960 600 950 600 L 30 600 Q 20 600 20 590 Z" fill="#16181d" stroke="#2b2e35" stroke-width="1"/>
    <circle cx="36" cy="584" r="4" fill="#34d399"/>
    <text x="48" y="588" class="sans" font-size="11" fill="#8b949e">Evaluated 8 complexity families in 0.38 ms • Arbitrary-Precision BigDecimal/BigInteger &amp; Ramanujan Asymptotics</text>
    <text x="944" y="588" class="sans" font-size="11" fill="#5c6370" text-anchor="end">Java 17 • FlatLaf Dark v3.5.4 • JUnit 5 (34 tests)</text>
  </g>
</svg>
